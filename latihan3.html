<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan 3</title>
  </head>
  <body>
    <script>
      jam = window.prompt("Jam Sekarang");

      if (isNaN(jam) || jam < 0 || jam > 23) {
        ucapan = "Format jam tidak valid! Masukkan angka antara 0 sampai 23.";
      } else {
        if (jam >= 6 && jam <= 10) {
          ucapan = "Selamat Pagi";
        } else if (jam >= 11 && jam <= 14) {
          ucapan = "Selamat Siang";
        } else if (jam >= 15 && jam <= 17) {
          ucapan = "Selamat Sore";
        } else if (jam >= 18 && jam <= 22) {
          ucapan = "Selamat Malam";
        } else {
          ucapan = "Selamat Tidur";
        }
      }

      document.write(ucapan);
    </script>
  </body>
</html>
